# SonarQube analysis settings for the local pre-release gate
# (.claude/skills/sonarqube-scan). Paths are relative to the repository root.

sonar.projectKey=styled-markdown
sonar.projectName=Styled Markdown
sonar.sourceEncoding=UTF-8

# Hand-written code only. Bundled output (dist/, skills/*/scripts/smd.cjs), vendored libraries
# (media/vendor/) and the Tree-sitter parser generated from grammar.js (src/parser.c and the
# src/tree_sitter/ headers) would only add noise.
sonar.sources=integrations/mkdocs/mkdocs_styled_markdown,integrations/tree-sitter-smd/grammar.js,integrations/tree-sitter-smd/scripts,extension/src,playground/src,extension/scripts,extension/media,extension/syntaxes,validate,.claude/skills/smd-release/scripts,.claude/skills/version-control/scripts,.claude/skills/sonarqube-scan/scripts
sonar.tests=extension/test,integrations/mkdocs/tests
sonar.exclusions=**/node_modules/**,integrations/tree-sitter-smd/src/parser.c,integrations/tree-sitter-smd/src/tree_sitter/**,integrations/tree-sitter-smd/src/grammar.json,integrations/tree-sitter-smd/src/node-types.json,**/dist/**,integrations/mkdocs/mkdocs_styled_markdown/bridge.cjs,integrations/mkdocs/.venv/**,extension/media/vendor/**,**/*.png,**/*.svg
sonar.test.inclusions=extension/test/**,integrations/mkdocs/tests/**
sonar.python.version=3.9

# Written by `sonar-scan.mjs` from the unit test run (Node's built-in coverage).
sonar.javascript.lcov.reportPaths=extension/coverage/lcov.info
sonar.typescript.tsconfigPaths=extension/tsconfig.json

# Test fixtures and the compatibility corpus are copies by design.
sonar.cpd.exclusions=extension/test/**,integrations/mkdocs/tests/**

# SonarQube analysis settings for the local pre-release gate
# (.claude/skills/sonarqube-scan). Paths are relative to the repository root.

sonar.projectKey=styled-markdown
sonar.projectName=Styled Markdown
sonar.sourceEncoding=UTF-8

# Hand-written code only. Bundled output (dist/, skills/*/scripts/smd.cjs) and vendored
# libraries (media/vendor/) are generated and would only add noise.
sonar.sources=extension/src,extension/scripts,extension/media,extension/syntaxes,validate,.claude/skills/smd-release/scripts,.claude/skills/version-control/scripts,.claude/skills/sonarqube-scan/scripts
sonar.tests=extension/test
sonar.exclusions=**/node_modules/**,**/dist/**,extension/media/vendor/**,**/*.png,**/*.svg
sonar.test.inclusions=extension/test/**

# Written by `sonar-scan.mjs` from the unit test run (Node's built-in coverage).
sonar.javascript.lcov.reportPaths=extension/coverage/lcov.info
sonar.typescript.tsconfigPaths=extension/tsconfig.json

# Test fixtures and the compatibility corpus are copies by design.
sonar.cpd.exclusions=extension/test/**

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mkdocs-styled-markdown"
# The Styled Markdown release version (extension/scripts/release/check-versions.mjs checks it).
version = "1.7.0"
description = "MkDocs plugin that renders Styled Markdown (.smd) pages, and optionally .smd syntax in .md pages."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Roshan Alwis" }]
keywords = ["mkdocs", "mkdocs-plugin", "markdown", "smd", "styled markdown", "documentation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Plugins",
  "Framework :: MkDocs",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Topic :: Documentation",
  "Topic :: Text Processing :: Markup :: Markdown",
]
dependencies = ["mkdocs>=1.6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/bislink360/styled-markdown/tree/main/integrations/mkdocs"
Source = "https://github.com/bislink360/styled-markdown"
Issues = "https://github.com/bislink360/styled-markdown/issues"
Changelog = "https://github.com/bislink360/styled-markdown/blob/main/extension/CHANGELOG.md"

[project.entry-points."mkdocs.plugins"]
styled-markdown = "mkdocs_styled_markdown.plugin:StyledMarkdownPlugin"

[tool.hatch.build.targets.wheel]
packages = ["mkdocs_styled_markdown"]

[tool.hatch.build.targets.sdist]
include = ["mkdocs_styled_markdown", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

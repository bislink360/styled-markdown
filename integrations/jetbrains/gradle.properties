# The IDE the plugin compiles against when -PlocalIde=<folder of an installed IDE> is not given (CI, release).
# The plugin declares since-build 251 (2025.1) and uses only APIs that exist there.
platformVersion = 2025.3.2

# The IDE provides the Kotlin standard library.
kotlin.stdlib.default.dependency = false

org.gradle.configuration-cache = true
org.gradle.caching = true

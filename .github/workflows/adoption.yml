name: Adoption

# Weekly adoption numbers (stars, outside contributions, release downloads, npm, VS Code Marketplace, Open VSX,
# PyPI, public `smd: 2` documents) in the run's job summary. Read-only: it writes nothing to the repository.
# The same report locally: node extension/scripts/adoption.mjs (needs a logged-in gh).

on:
  schedule:
    - cron: '17 6 * * 1'   # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: extension/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Adoption report
        env:
          # GitHub's code search may refuse the workflow's own token; a read-only personal access token in the
          # ADOPTION_TOKEN secret (public repositories, no scopes) makes that row work. Without it, that row
          # says "unavailable" and the rest of the report is unaffected.
          GH_TOKEN: ${{ secrets.ADOPTION_TOKEN || github.token }}
        run: |
          node extension/scripts/adoption.mjs --maintainers "${{ github.repository_owner }}" | tee -a "$GITHUB_STEP_SUMMARY"
          node extension/scripts/adoption.mjs --json --maintainers "${{ github.repository_owner }}" > adoption.json
      - uses: actions/upload-artifact@v4
        with:
          name: adoption-${{ github.run_id }}
          path: adoption.json
          retention-days: 90
